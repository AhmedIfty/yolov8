# YOLOv8m-P2 with Weighted Fusion at P3
# Save as: cfg/models/v8/yolov8m_p2_weighted.yaml

nc: 7  # number of classes
scales:
  m: [0.67, 0.75, 768]

# YOLOv8m backbone - UNCHANGED
backbone:
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 3, C2f, [128, True]]      # 2  (P2)
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 6, C2f, [256, True]]      # 4  (P3)
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16
  - [-1, 6, C2f, [512, True]]      # 6  (P4)
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5/32
  - [-1, 3, C2f, [1024, True]]     # 8
  - [-1, 1, SPPF, [1024, 5]]       # 9

# YOLOv8-P2 head with ONE weighted fusion
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 6], 1, Concat, [1]]                   # 11 - Standard concat at P4
  - [-1, 3, C2f, [512]]                         # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  # ONLY CHANGE: Replace Concat with WeightedSumFusion at P3
  - [[-1, 4], 1, WeightedSumFusion, []]         # 14 - WEIGHTED fusion at P3
  - [-1, 3, C2f, [256]]                         # 15 (P3/8)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 16
  - [[-1, 2], 1, Concat, [1]]                   # 17 - Standard concat at P2
  - [-1, 3, C2f, [128]]                         # 18 (P2/4)

  - [-1, 1, Conv, [128, 3, 2]]                  # 19
  - [[-1, 15], 1, Concat, [1]]                  # 20 - Standard concat
  - [-1, 3, C2f, [256]]                         # 21 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]                  # 22
  - [[-1, 12], 1, Concat, [1]]                  # 23 - Standard concat
  - [-1, 3, C2f, [512]]                         # 24 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]]                  # 25
  - [[-1, 9], 1, Concat, [1]]                   # 26 - Standard concat
  - [-1, 3, C2f, [1024]]                        # 27 (P5/32)

  - [[18, 21, 24, 27], 1, Detect, [nc]]        # 28 - Detection head