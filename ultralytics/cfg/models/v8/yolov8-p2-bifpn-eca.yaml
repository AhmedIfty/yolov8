# YOLOv8m with P2 + PAN + BiFPN Refiner
# Save as: cfg/models/v8/yolov8m_p2_bifpn_refiner.yaml

nc: 7  # number of classes (e.g., 80 for COCO)
scales:
  m: [0.67, 0.75, 768]

# YOLOv8m backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 3, C2f, [128, True]]      # 2  (P2)
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 6, C2f, [256, True]]      # 4  (P3)
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16
  - [-1, 6, C2f, [512, True]]      # 6  (P4)
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5/32
  - [-1, 3, C2f, [1024, True]]     # 8
  - [-1, 1, SPPF, [1024, 5]]       # 9

# YOLOv8 P2 head with PAN
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 6], 1, Concat, [1]]                   # 11 cat backbone P4
  - [-1, 3, C2f, [512]]                         # 12
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 4], 1, Concat, [1]]                   # 14 cat backbone P3
  - [-1, 3, C2f, [256]]                         # 15 (P3/8-small)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 16
  - [[-1, 2], 1, Concat, [1]]                   # 17 cat backbone P2
  - [-1, 3, C2f, [128]]                         # 18 (P2/4-xsmall) - PAN output 1
  - [-1, 1, Conv, [128, 3, 2]]                  # 19
  - [[-1, 15], 1, Concat, [1]]                  # 20 cat head P3
  - [-1, 3, C2f, [256]]                         # 21 (P3/8-small) - PAN output 2
  - [-1, 1, Conv, [256, 3, 2]]                  # 22
  - [[-1, 12], 1, Concat, [1]]                  # 23 cat head P4
  - [-1, 3, C2f, [512]]                         # 24 (P4/16-medium) - PAN output 3
  - [-1, 1, Conv, [512, 3, 2]]                  # 25
  - [[-1, 9], 1, Concat, [1]]                   # 26 cat head P5
  - [-1, 3, C2f, [1024]]                        # 27 (P5/32-large) - PAN output 4

  # BiFPN refiner - takes all 4 PAN outputs [P2, P3, P4, P5]
  # Args: [internal_channels, use_eca] - starting with ECA disabled
  - [[18, 21, 24, 27], 1, BiFPN_ECA, [192, False]]  # 28 -> returns a list of 4 tensors

  # Split the BiFPN output list into 4 separate nodes for the Detect head
  # Args: [channel_width (ignored by parser), index]
  # Split the BiFPN output list into 4 separate nodes.
  # The argument is now just the index [0], [1], etc.
  - [28, 1, BiFPNIndex, [0]]  # 29 - P2 refined
  - [28, 1, BiFPNIndex, [1]]  # 30 - P3 refined
  - [28, 1, BiFPNIndex, [2]]  # 31 - P4 refined
  - [28, 1, BiFPNIndex, [3]]  # 32 - P5 refined

  # Detection head on the 4 refined feature maps
  - [[29, 30, 31, 32], 1, Detect, [nc]]  # 33



